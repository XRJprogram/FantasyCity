<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>幻想城 · 全站导航览</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- 统一页眉页脚样式与脚本 -->
    <link rel="stylesheet" href="resources/layout.css" />
    <script src="resources/layout.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-page: #FDF5ED;
            --bg-card: #FFFFFF;
            --bg-sidebar: #F8F0E8;
            --text-primary: #3D2B1F;
            --text-secondary: #5A4A3A;
            --text-light: #8A7A6A;
            --accent: #C0392B;
            --accent-hover: #A93226;
            --accent-soft: rgba(192, 57, 43, 0.08);
            --gold: #D4AF37;
            --border-light: #E8DDD2;
            --shadow-soft: 0 8px 30px rgba(61, 43, 31, 0.06);
            --shadow-hover: 0 14px 40px rgba(61, 43, 31, 0.12);
            --radius: 16px;
            --radius-sm: 8px;
            --radius-pill: 40px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-serif: 'Noto Serif SC', 'Songti SC', 'Georgia', serif;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-serif);
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.75;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(240, 220, 205, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(245, 230, 215, 0.4) 0%, transparent 40%);
            background-attachment: fixed;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        /* ---------- 导航栏 ---------- */
        .navbar {
            background: rgba(253, 245, 237, 0.55);
            border-bottom: 1px solid rgba(232, 221, 210, 0.48);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            box-shadow: 0 4px 20px rgba(61, 43, 31, 0.04);
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .nav-brand {
            font-size: 1.45rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
            letter-spacing: -0.01em;
        }
        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .nav-links a {
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            background: transparent;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .nav-links a.icon-only {
            padding: 8px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            gap: 0;
            font-size: 1rem;
        }
        .nav-links a:hover,
        .nav-links a.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(192, 57, 43, 0.25);
        }

        /* ---------- 头部横幅 ---------- */
        .banner {
            padding: 50px 0 30px;
            text-align: center;
        }
        .banner h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .banner p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 680px;
            margin: 0 auto 24px;
        }
        .link-badge-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .badge-link {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-secondary);
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .badge-link:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }

        /* ---------- 模块网格卡片 (4列排版) ---------- */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 30px 0 60px;
        }
        .portal-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            padding: 26px 20px;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .portal-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
            border-color: #DBCDBF;
        }
        .portal-card-top {
            margin-bottom: 16px;
        }
        .portal-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 14px;
            transition: var(--transition);
        }
        .portal-card:hover .portal-icon {
            background: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }
        .portal-card h2 {
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        .portal-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        @media (max-width: 1024px) {
            .portal-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }
        }
        @media (max-width: 580px) {
            .portal-grid {
                grid-template-columns: 1fr;
            }
        }
        .portal-features {
            list-style: none;
            margin: 16px 0;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .portal-features li i {
            color: var(--accent);
            margin-right: 6px;
        }
        .card-btn {
            background: var(--accent);
            color: #fff;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 0.92rem;
            text-align: center;
            display: block;
            transition: var(--transition);
            box-shadow: 0 4px 14px rgba(192, 57, 43, 0.2);
        }
        .card-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(192, 57, 43, 0.3);
        }

        /* ---------- 页脚 ---------- */
        .footer {
            margin-top: auto;
            padding: 36px 0 28px;
            border-top: 1px solid var(--border-light);
            text-align: center;
            color: var(--text-light);
            font-size: 0.88rem;
            background: rgba(255, 255, 255, 0.6);
        }
        .footer .footer-links {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 16px;
            font-family: var(--font-sans);
            font-size: 0.82rem;
        }
        .footer .footer-links a {
            color: var(--text-secondary);
        }
        .footer .footer-links a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <!-- ===== 页眉 (由 resources/layout.js 统一从 resources/header.html 载入) ===== -->
    <div id="site-header"></div>

    <!-- ===== 头部区域 ===== -->
    <header class="banner">
        <div class="container">
            <h1>全局视图</h1>
            <p>全站核心模块与资源导航总览</p>
        </div>
    </header>

    <!-- ===== 核心板块导览 ===== -->
    <main class="container">
        <div class="portal-grid">
            <!-- 首页板块 -->
            <div class="portal-card">
                <div class="portal-card-top">
                    <div class="portal-icon">
                        <i class="fas fa-home"></i>
                    </div>
                    <h2>社区首页</h2>
                    <p>
                        核心世界观架构、登场人物图鉴。
                    </p>
                </div>
                <a href="index.html" class="card-btn">进入首页</a>
            </div>

            <!-- 小说阅读板块 -->
            <div class="portal-card">
                <div class="portal-card-top">
                    <div class="portal-icon">
                        <i class="fas fa-book-open"></i>
                    </div>
                    <h2>小说连载</h2>
                    <p>
                        原创长篇小说《幻想城》重制版正篇连载。
                    </p>
                </div>
                <a href="novel.html" class="card-btn">阅读小说</a>
            </div>

            <!-- 游戏体验板块 -->
            <div class="portal-card">
                <div class="portal-card-top">
                    <div class="portal-icon">
                        <i class="fas fa-gamepad"></i>
                    </div>
                    <h2>游戏体验</h2>
                    <p>
                        像素风卡牌探索游戏《幻想城·遗失的能力》，支持在线游玩。
                    </p>
                </div>
                <a href="games.html" class="card-btn">启动游戏</a>
            </div>

            <!-- 世界设定与角色图鉴板块 -->
            <div class="portal-card">
                <div class="portal-card-top">
                    <div class="portal-icon">
                        <i class="fas fa-scroll"></i>
                    </div>
                    <h2>设定档案</h2>
                    <p>
                        核心世界观、能力法则体系与全体能力者系别图鉴。
                    </p>
                </div>
                <a href="lore.html" class="card-btn">浏览设定</a>
            </div>
        </div>
    </main>

    <!-- ===== 页脚 (由 resources/layout.js 统一从 resources/footer.html 载入) ===== -->
    <div id="site-footer"></div>
</body>
</html>
